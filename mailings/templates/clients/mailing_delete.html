{% extends "base.html" %}
{% block title %}Удалить клиента{% endblock %}
{% block content %}
  <h1>Удалить клиента</h1>
  <p>Вы уверены, что хотите удалить клиента <strong>{{ object.full_name }}</strong> ({{ object.email }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-link">Отменить</a>
  </form>
{% endblock %}
