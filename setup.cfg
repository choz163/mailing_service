[flake8]
max-line-length = 119
exclude = .venv, .gitignore,__pycache__,docs/source/conf.py,build,dist,tests
ignore = I101,D100,D101,D102,D103,D104,D105,D107,D401,E203,I900,N802,N806,N812,W503,S311,S605,S607,ISC003,ISC001,T101,T000,F541,PL123
per-file-ignores = __init__.py:F401,F403,
    mailings/management/commands/*.py: F401, F841
    mailings/models.py: F401
    mailings/tests.py: F401
    users/admin.py: F401
    users/tests.py: F401
    users/urls.py: F401
    users/views.py: F401
    users/migrations/*.py: E501, F401, F841


[black]
max-line-length = 119
exclude =.git,__pycache__,docs/source/conf.py,build,dist,tests